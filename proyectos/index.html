<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#101e31">
    <meta name="description" content="Proyectos de software y prácticas de aprendizaje de Eduardo Valera.">
    <title>Proyectos | EdValera</title>

    <link rel="icon" type="image/svg+xml" href="/assets/images/logoed-favicon.svg">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <script defer src="/assets/js/projects-data.js"></script>
    <script defer src="/assets/js/site.js"></script>
</head>

<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <!-- Encabezado -->
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/" aria-label="EdValera, ir al inicio">
                <img src="/assets/images/logoed.svg" alt="" width="44" height="44">
            </a>

            <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-controls="main-nav"
                aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Navegación -->
            <nav id="main-nav" class="main-nav" aria-label="Navegación principal">
                <a href="/">Inicio</a>
                <a href="/sobre-mi/">Sobre mí</a>
                <a href="/proyectos/" aria-current="page">Proyectos</a>
                <a href="/laboratorio-ti/">Laboratorio TI</a>
                <a href="/contacto/">Contacto</a>
            </nav>
        </div>
    </header>

    <main id="contenido">

        <!-- Proyectos -->
        <section class="section compact-top">
            <div class="container">
                <div class="page-intro">
                    <h1>Proyectos</h1>
                    <p>Explora los proyectos que he desarrollado, sus características y resultados.</p>
                </div>

                <!-- Lista de proyectos -->
                <div class="projects-grid" id="projectsGrid"></div>

                <p class="empty-state" id="projectsEmpty" hidden>
                    No hay proyectos disponibles.
                </p>
            </div>
        </section>

        <!-- Detalles del proyecto -->
        <dialog class="project-dialog" id="projectDialog" aria-labelledby="dialogTitle">
            <button type="button" class="dialog-close" id="closeDialog" aria-label="Cerrar detalles">✕</button>
            <div id="dialogContent"></div>
        </dialog>

    </main>

    <!-- Pie de página -->
    <footer class="site-footer">
        <div class="container footer-inner">
            <span>© <span id="year"></span> · EdValera</span>

            <div>
                <a href="https://github.com/edvalera" target="_blank" rel="noopener noreferrer">
                    <i class="bi bi-github"></i> GitHub
                </a>

                <a href="https://www.linkedin.com/in/edvalera/" target="_blank" rel="noopener noreferrer">
                    <i class="bi bi-linkedin"></i> LinkedIn
                </a>
            </div>
        </div>
    </footer>
</body>

</html>
